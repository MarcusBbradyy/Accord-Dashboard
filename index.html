        <td style="font-size:11px;color:var(--muted)">${esc(s.timing)}</td>
        <td><span class="${stCls}">${stLbl}</span></td>
      </tr>`;
    }).join('');
    const pipeBody = pipeRows
      ? `<table class="kpi-table" style="margin-top:0;">
          <thead><tr>
            <th style="text-align:center">#</th><th>SOLUTION</th><th>2026 TARGET</th>
            <th>AI</th><th>SPEED</th><th>FTE</th><th style="text-align:center">SCORE</th>
            <th>WAVE</th><th>TIMING</th><th>STATUS</th>
          </tr></thead>
          <tbody>${pipeRows}</tbody>
        </table>`
      : `<div style="padding:16px 4px;font-size:13px;color:var(--muted)">Solution pipeline not yet populated for this workstream - add entries to the <code>solutionPipeline</code> array in the DATA object.</div>`;
    pipelineHtml = `
      <div class="stage-card" style="margin-top:16px;">
        <div class="stage-card-title">Solution Pipeline</div>
        <div class="stage-card-sub">${activeInPipe > 0 ? `${activeInPipe} active · ` : ''}Ranked by weighted score (Revenue 40% + AI 20% + Speed 20% + FTE 20%) · H = 10, M = 5, L = 2</div>
        ${pipeBody}
      </div>`;
  }

  // KPI rows (standalone)
  const kpiRows = pod.kpis.map(k =>
    `<tr><td>${esc(k.metric)}</td><td>${esc(k.baseline)}</td><td>${esc(k.target)}</td><td>${esc(k.result)}</td></tr>`).join('');

  // Roadmap - Gantt for AI Solutions, table for other pods
  const roadmapHtml = (() => {
    if (pod.id === 'ai-solutions') {
      const GR = [
        { label: "W1: F&A Diagnostic & RCM",               start: 0, end: 1,  color: '#C5E86B', tc: '#1A3A00' },
        { label: "W1: L2C/CRM, ERP & CPM/B&F",             start: 1, end: 2,  color: '#C5E86B', tc: '#1A3A00' },
        { label: "W2: Data Platform & Cash Flow",            start: 2, end: 3,  color: '#D4A96A', tc: '#3B1F00' },
        { label: "W2: Finance Onboarding & Exit Readiness",  start: 3, end: 4,  color: '#D4A96A', tc: '#3B1F00' },
        { label: "W3: Consolidations",                      start: 4, end: 5,  color: '#93C5FD', tc: '#1E3A6E' },
        { label: "W3: Close Acceleration & Source to Pay",  start: 5, end: 6,  color: '#93C5FD', tc: '#1E3A6E' },
        { label: "W4: Liquidity & Supply Chain",            start: 6, end: 7,  color: '#6EE7B7', tc: '#064E3B' },
        { label: "W4: Merger Integration & Tech Advisory",  start: 7, end: 8,  color: '#6EE7B7', tc: '#064E3B' },
        { label: "W5: Carve-Out & Software Selection",      start: 8, end: 9,  color: '#C4B5FD', tc: '#2E1065' },
        { label: "W5: IPO Readiness",                       start: 9, end: 10, color: '#C4B5FD', tc: '#2E1065' },
        { label: "Legal / IT / Marketing & Change Mgmt",    start: 0, end: 10, color: '#CBEF4E', tc: '#1A2332' }
      ];
      const hdrCells = Array.from({length: 11}, (_,i) => {
        if (i === 0) return `<th style="background:var(--navy);color:white;border-radius:4px 4px 0 0;padding:5px 3px 4px;text-align:center;font-size:10px;vertical-align:top;"><span style="background:#CBEF4E;color:var(--navy);font-size:8px;font-weight:800;padding:1px 5px;border-radius:2px;display:inline-block;margin-bottom:2px;letter-spacing:0.05em;">NOW</span><div style="font-size:11px;font-weight:700;">M0</div><div style="font-size:7px;color:rgba(255,255,255,0.6);margin-top:2px;line-height:1.25;font-weight:400;">Mobilise &amp; schedule</div></th>`;
        return `<th style="font-size:10px;font-weight:600;text-align:center;color:var(--muted);padding:6px 2px;background:#F0F0EC;border-radius:4px 4px 0 0;">M${i}</th>`;
      }).join('');
      const bodyRows = GR.map(r => {
        const cells = [];
        for (let i = 0; i < r.start; i++) cells.push(`<td style="background:#EEEEE9;border-radius:3px;"></td>`);
        cells.push(`<td colspan="${r.end - r.start + 1}" style="background:${r.color};border-radius:4px;padding:0 5px;font-size:8px;font-weight:700;color:${r.tc};text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></td>`);
        for (let i = r.end + 1; i <= 10; i++) cells.push(`<td style="background:#EEEEE9;border-radius:3px;"></td>`);
        return `<tr style="height:26px;"><td style="font-size:10px;font-weight:600;padding:3px 10px 3px 0;color:var(--text);white-space:nowrap;">${esc(r.label)}</td>${cells.join('')}</tr>`;
      }).join('');
      return `<div class="stage-card" style="margin-top:16px;">
        <div class="stage-card-title">High Level Delivery Roadmap</div>
        <div class="stage-card-sub">10-Month sequenced wave delivery - all AI solutions transformed</div>
        <div style="overflow-x:auto;margin-top:14px;">
          <table style="width:100%;border-collapse:separate;border-spacing:3px 3px;table-layout:auto;min-width:680px;">
            <thead><tr>
              <th style="width:195px;text-align:left;font-size:9px;font-weight:700;color:var(--muted);padding-bottom:4px;letter-spacing:0.08em;vertical-align:bottom;">WORKSTREAM</th>
              ${hdrCells}
            </tr></thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>
        <div style="margin-top:10px;padding:9px 16px;background:var(--navy);border-radius:6px;color:white;font-size:12px;font-weight:700;text-align:center;letter-spacing:0.02em;">
          Goal: All solutions have been transformed using AI in 10 months.
        </div>
      </div>`;
    }
    // ── Blank Gantt placeholder for other pods ──
    const MONTHS = 11;
    const blankHdr = Array.from({length: MONTHS}, (_,i) => {
      if (i === 0) return `<th style="background:var(--navy);color:white;border-radius:4px 4px 0 0;padding:5px 3px 4px;text-align:center;font-size:10px;vertical-align:top;"><span style="background:#CBEF4E;color:var(--navy);font-size:8px;font-weight:800;padding:1px 5px;border-radius:2px;display:inline-block;margin-bottom:2px;letter-spacing:0.05em;">NOW</span><div style="font-size:11px;font-weight:700;">M0</div><div style="font-size:7px;color:rgba(255,255,255,0.6);margin-top:2px;line-height:1.25;font-weight:400;">Mobilise &amp; schedule</div></th>`;
      return `<th style="font-size:10px;font-weight:600;text-align:center;color:var(--muted);padding:6px 2px;background:#F0F0EC;border-radius:4px 4px 0 0;">M${i}</th>`;
    }).join('');
    const blankRows = Array.from({length: 6}, (_,i) => {
      const cells = Array.from({length: MONTHS}, () => `<td style="background:#EEEEE9;border-radius:3px;height:26px;"></td>`).join('');
      return `<tr style="height:26px;"><td style="font-size:10px;font-weight:500;padding:3px 10px 3px 0;color:var(--muted);white-space:nowrap;font-style:italic;">Workstream TBC</td>${cells}</tr>`;
    }).join('');
    const monthsLabel = pod.id === 'future-of-finance' ? '3-Month' : '10-Month';
    // FoF gets a shorter placeholder message per Marcus's request; other pods keep
    // the "Motive to work with workstream leads..." copy.
    const roadmapPlaceholder = pod.id === 'future-of-finance'
      ? 'Roadmap to be built out'
      : 'Motive to work with workstream leads to build out delivery roadmap';
    return `<div class="stage-card" style="margin-top:16px;">
      <div class="stage-card-title">High Level Delivery Roadmap</div>
      <div class="stage-card-sub">${monthsLabel} sequenced wave delivery - workstream sequencing to be confirmed</div>
      <div class="placeholder-wrap" style="overflow-x:auto;margin-top:14px;">
        <table style="width:100%;border-collapse:separate;border-spacing:3px 3px;table-layout:auto;min-width:680px;">
          <thead><tr>
            <th style="width:195px;text-align:left;font-size:9px;font-weight:700;color:var(--muted);padding-bottom:4px;letter-spacing:0.08em;vertical-align:bottom;">WORKSTREAM</th>
            ${blankHdr}
          </tr></thead>
          <tbody>${blankRows}</tbody>
        </table>
        <div class="placeholder-overlay"><div class="placeholder-overlay-text">${roadmapPlaceholder}</div></div>
      </div>
      <div style="margin-top:10px;padding:9px 16px;background:#F0F0EC;border-radius:6px;color:var(--muted);font-size:11px;font-weight:600;text-align:center;letter-spacing:0.02em;border:1px dashed var(--border);">
        Roadmap to be confirmed - workstream sequencing and timing TBC
      </div>
    </div>`;
  })();

  // Resourcing
  const resourcingHtml = (pod.resourcing && pod.resourcing.length) ? (() => {
    const typeLbl = { motive:'MOTIVE CREATE', accordion:'ACCORDION', partner:'ELECTRIC MIND', tbc:'TBC' };
    const typeCls = { motive:'background:#EFF6FF;color:#1D4ED8;', accordion:'background:#F0FDF4;color:#14532D;', partner:'background:#FAF5FF;color:#6B21A8;', tbc:'background:#F3F4F6;color:#6B7280;' };
    const rows = pod.resourcing.map(r => `
      <tr>
        <td style="font-size:12px;font-weight:600;">${esc(r.name)}</td>
        <td style="font-size:12px;color:var(--muted)">${esc(r.role)}</td>
        <td><span style="font-size:9px;font-weight:800;padding:2px 8px;border-radius:3px;letter-spacing:0.06em;${typeCls[r.type]||''}">${typeLbl[r.type]||esc(r.type)}</span></td>
      </tr>`).join('');
    return `
    <div class="stage-card" style="margin-top:16px;">
      <div class="stage-card-title">Pod Resourcing</div>
      <div class="stage-card-sub">Named resources and roles - update as confirmed</div>
      <table class="kpi-table" style="margin-top:8px;">
        <thead><tr><th>NAME</th><th>ROLE</th><th>ORG</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  })() : '';

  // Key 30 / 60-day Milestones - sourced from pod.keyMilestone30Day / 60Day.
  // Treats common "no value yet" strings as blank so they render as a grey placeholder.
  // Rendered INSIDE the Workstream Description box (alongside Overview + Objective)
  // rather than as its own standalone card.
  const isBlankMilestone = (v) => {
    if (v == null) return true;
    const s = String(v).trim().toLowerCase();
    return s === '' || s === 'tbd' || s === 'tbc' || s === 'to be agreed'
        || s === 'to be confirmed' || s === 'to be defined' || s === 'n/a';
  };
  const milestoneBlock = (label, value) => isBlankMilestone(value)
    ? `<div class="milestone-blank">Milestones to be provided</div>`
    : `<div class="milestone-text">${esc(value)}</div>`;
  const milestonesInlineHtml = `
    <div class="milestones-grid">
      <div class="milestone-col">
        <div class="milestone-col-head"><span class="milestone-col-pill">30-DAY</span><span class="milestone-col-lbl">Targets</span></div>
        ${milestoneBlock('30-day', pod.keyMilestone30Day)}
      </div>
      <div class="milestone-col">
        <div class="milestone-col-head"><span class="milestone-col-pill">60-DAY</span><span class="milestone-col-lbl">Targets</span></div>
        ${milestoneBlock('60-day', pod.keyMilestone60Day)}
      </div>
    </div>`;

  // ── Open-items counters (Actions / Decisions / Risks / Dependencies) ──
  // Counts open rows from TRACKER for this workstream and for Cross-workstream.
  // Workstream labels in TRACKER use mixed en-dash / hyphen, so normalise both.
  const openItemsHtml = (() => {
    const norm = (s) => String(s || '').replace(/[–—]/g, '-').replace(/\s+/g,' ').trim().toLowerCase();
    const POD_TO_WS = {
      'ai-solutions':      'ws1 - ai solutions',
      'future-of-finance': 'ws2 - future of finance',
      'btt-solutions':     'ws3 - bt&t',
      'ai-biz-ops':        'ws4 - bizops ai',
    };
    const podWS = POD_TO_WS[pod.id] || '';
    const isCross = (v) => norm(v) === 'cross-workstream';
    const isPod   = (v) => norm(v) === podWS;
    const isOpen  = (s) => {
      const ss = norm(s);
      return ss !== '' && !['done','resolved','complete','completed','closed','cancelled','canceled'].includes(ss);
    };

    const count = (rows, wsField, podMatch) => rows.filter(r =>
      isOpen(r.Status) && (podMatch ? isPod(r[wsField]) : isCross(r[wsField]))
    ).length;

    const A = TRACKER.actions      ? TRACKER.actions.rows      : [];
    const D = TRACKER.decisions    ? TRACKER.decisions.rows    : [];
    const R = TRACKER.risks        ? TRACKER.risks.rows        : [];
    const P = TRACKER.dependencies ? TRACKER.dependencies.rows : [];

    const wsCounts = {
      actions:      count(A, 'Workstream',  true),
      decisions:    count(D, 'Workstream',  true),
      risks:        count(R, 'Impacted WS', true),
      dependencies: count(P, 'Dependent WS', true),
    };
    const xCounts = {
      actions:      count(A, 'Workstream',  false),
      decisions:    count(D, 'Workstream',  false),
      risks:        count(R, 'Impacted WS', false),
      dependencies: count(P, 'Dependent WS', false),
    };

    const cell = (n, key, lbl) => `
      <div class="oi-panel-cell">
        <div class="oi-panel-num ${key}${n === 0 ? ' zero' : ''}">${n}</div>
        <div class="oi-panel-lbl">Open ${lbl}</div>
      </div>`;
    const panel = (header, c) => `
      <div class="oi-panel-wrap">
        <div class="oi-panel-header">${header}</div>
        <div class="oi-panel">
          ${cell(c.actions,      'actions',      'Actions')}
          ${cell(c.decisions,    'decisions',    'Decisions')}
          ${cell(c.risks,        'risks',        'Risks')}
          ${cell(c.dependencies, 'dependencies', 'Dependencies')}
        </div>
      </div>`;

    return `
      <div class="open-items-block">
        <div class="section-label" style="margin-bottom:12px;">Open Items</div>
        <div class="open-items-stack">
          ${panel('Workstream', wsCounts)}
          ${panel('Cross-Workstream', xCounts)}
        </div>
      </div>`;
  })();

  // ── This Week's Key Deliverables — visual progress block ──
  // Donut + stat cards + per-deliverable list with status pills.
  // Sourced from pod.weeklyDeliverables (status: done | in-progress | not-started | blocked).
  const weeklyDeliverablesHtml = (() => {
    const items = pod.weeklyDeliverables || [];
    const total = items.length;
    if (total === 0) {
      return `
        <div class="weekly-row">
          <div class="section-label">This Week's Key Deliverables</div>
          <div style="font-size:12px;color:var(--muted);font-style:italic;padding:16px 0;">No deliverables tracked yet for this week.</div>
        </div>`;
    }
    const counts = { done: 0, 'in-progress': 0, 'not-started': 0, blocked: 0 };
    items.forEach(it => { if (counts[it.status] != null) counts[it.status]++; });

    // Conic gradient stops (in %): done → in-progress → blocked → not-started
    const donePct = (counts.done / total) * 100;
    const ipPct   = (counts['in-progress'] / total) * 100;
    const blPct   = (counts.blocked / total) * 100;
    const doneEnd = donePct;
    const ipEnd   = doneEnd + ipPct;
    const blEnd   = ipEnd + blPct;
    const ringStyle = `--done-end:${doneEnd.toFixed(2)}%; --ip-end:${ipEnd.toFixed(2)}%; --bl-end:${blEnd.toFixed(2)}%;`;

    const headlineLabel = counts.done === total ? 'COMPLETE'
      : counts.blocked > 0 ? 'AT RISK'
      : counts['in-progress'] >= counts['not-started'] ? 'IN PROGRESS'
      : 'EARLY';
    const donePctRound = Math.round(donePct);

    // Stacked bar segments (skip zero-width to avoid visual artefacts)
    const seg = (cls, pct) => pct > 0 ? `<div class="wkd-stacked-seg ${cls}" style="width:${pct.toFixed(2)}%;"></div>` : '';
    const stackedBar = `
      <div class="wkd-stacked-bar">
        ${seg('done',         donePct)}
        ${seg('in-progress', ipPct)}
        ${seg('blocked',     blPct)}
        ${seg('not-started', (counts['not-started']/total)*100)}
      </div>`;

    const statCard = (cls, n, lbl) => `
      <div class="wkd-stat ${cls}">
        <div class="wkd-stat-num">${n}</div>
        <div class="wkd-stat-lbl">${lbl}</div>
      </div>`;

    const icon = (s) => s === 'done' ? '✓' : s === 'blocked' ? '✕' : s === 'in-progress' ? '◐' : '○';
    const pillLbl = (s) => ({ 'done':'DONE','in-progress':'IN PROGRESS','not-started':'NOT STARTED','blocked':'BLOCKED' })[s] || s.toUpperCase();
    const itemRows = items.map(it => {
      const note = (it.note || '').trim();
      return `
      <div class="wkd-list-item ${it.status}">
        <div class="wkd-li-icon">${icon(it.status)}</div>
        <div class="wkd-li-text">${esc(it.text)}</div>
        <div class="wkd-li-note${note ? '' : ' empty'}">${note ? esc(note) : '—'}</div>
        <span class="wkd-li-pill ${it.status}">${pillLbl(it.status)}</span>
      </div>`;
    }).join('');

    return `
      <div class="weekly-row">
        <div class="section-label" style="margin-bottom:14px;">This Week's Key Deliverables</div>
        <div class="placeholder-wrap">
          <div class="wkd-card">
            <div class="wkd-vis-col">
              <div class="wkd-donut">
                <div class="wkd-donut-ring" style="${ringStyle}"></div>
                <div class="wkd-donut-center">
                  <div class="wkd-donut-num">${donePctRound}%</div>
                  <div class="wkd-donut-frac">${counts.done} of ${total} done</div>
                  <div class="wkd-donut-lbl">${headlineLabel}</div>
                </div>
              </div>
              ${stackedBar}
            </div>
            <div class="wkd-stats-col">
              <div class="wkd-stats-row">
                ${statCard('done',        counts.done,           'Done')}
                ${statCard('in-progress', counts['in-progress'], 'In Progress')}
                ${statCard('not-started', counts['not-started'], 'Not Started')}
                ${statCard('blocked',     counts.blocked,        'Blocked')}
              </div>
              <div class="wkd-list">
                ${itemRows}
              </div>
            </div>
          </div>
          <div class="placeholder-overlay"><div class="placeholder-overlay-text">Pending workstream input</div></div>
        </div>
      </div>`;
  })();

  // descBlock is built last so it can include the Milestones grid alongside
  // Workstream Overview + Workstream Objective (single combined box).
  const descBlock = (desc.summary || objectiveHtml || milestonesInlineHtml) ? `
    <div class="ws-description">
      <div class="ws-desc-body">
        ${desc.summary ? `
        <div class="ws-desc-label">Workstream Overview</div>
        <div class="ws-desc-text">${esc(desc.summary)}</div>` : ''}
        ${objectiveHtml ? `
        <div class="ws-desc-label" style="margin-top:14px;">Workstream Objective</div>
        ${objectiveHtml}` : ''}
        ${milestonesInlineHtml ? `
        <div class="ws-desc-label" style="margin-top:18px;">Key 30 &amp; 60-Day Milestones</div>
        ${milestonesInlineHtml}` : ''}
      </div>
    </div>` : '';

  // High-level Risks / Decisions / Dependencies card - title + badge only.
  // Full mitigation / owner / target-date detail lives on the Actions & Decisions tab.
  const rddCardHtml = (() => {
    const sevDot  = (s) => `<div class="rdd-dot rdd-dot-${s || 'low'}"></div>`;
    const sevPill = (s) => s ? `<span class="rdd-pill rdd-${s}">${s.toUpperCase()}</span>` : '';
    const depDot  = (s) => `<div class="rdd-dot rdd-dot-${s || 'open'}"></div>`;
    const depPill = (s) => s ? `<span class="rdd-pill rdd-${s}">${s.replace(/-/g,' ').toUpperCase()}</span>` : '';

    const rItems = (pod.risks || []).map(r => `
      <div class="rdd-item">
        ${sevDot(r.severity)}
        <span class="rdd-text">${esc(r.title)}</span>
        ${sevPill(r.severity)}
      </div>`).join('');

    const dItems = (pod.decisions || []).map(d => {
      const text = typeof d === 'string' ? d : d.text;
      const priority = (typeof d === 'object' && d.priority) ? d.priority : null;
      return `
      <div class="rdd-item">
        ${sevDot(priority)}
        <span class="rdd-text">${esc(text)}</span>
        ${sevPill(priority)}
      </div>`;
    }).join('');

    const pItems = (pod.podDependencies || []).map(d => `
      <div class="rdd-item">
        ${depDot(d.status)}
        <span class="rdd-text">${esc(d.description)}</span>
        ${depPill(d.status)}
      </div>`).join('');

    return `
    <div class="pod-rdd-card">
      <div class="pod-rdd-head">
        <div class="pod-rdd-title">Risks &middot; Decisions &middot; Dependencies<span class="pod-rdd-sub">High-level summary</span></div>
        <span class="pod-rdd-cta" role="button" tabindex="0" onclick="switchTab('actions-decisions')" onkeydown="if(event.key==='Enter'||event.key===' '){switchTab('actions-decisions');}">Full detail in Actions &amp; Decisions →</span>
      </div>
      <div class="pod-rdd-grid">
        <div class="pod-rdd-col">
          <div class="pod-rdd-col-head"><span class="pod-rdd-col-lbl">Risks &amp; Blockers</span><span class="pod-rdd-col-num">${(pod.risks || []).length}</span></div>
          ${rItems || '<div class="rdd-empty">No active risks</div>'}
        </div>
        <div class="pod-rdd-col">
          <div class="pod-rdd-col-head"><span class="pod-rdd-col-lbl">Key Decisions Needed</span><span class="pod-rdd-col-num">${(pod.decisions || []).length}</span></div>
          ${dItems || '<div class="rdd-empty">No open decisions</div>'}
        </div>
        <div class="pod-rdd-col">
          <div class="pod-rdd-col-head"><span class="pod-rdd-col-lbl">Dependencies</span><span class="pod-rdd-col-num">${(pod.podDependencies || []).length}</span></div>
          ${pItems || '<div class="rdd-empty">No active dependencies</div>'}
        </div>
      </div>
    </div>`;
  })();

  return `
    <!-- Pod Header (single W/C chip - sourced from DATA.weekCommencing) -->
    <div class="pod-header">
      <div class="pod-title">${esc(pod.name)}${ownerLabel}</div>
      <div class="pod-chips">
        <span class="chip">W/C ${esc(DATA.weekCommencing)}</span>
      </div>
    </div>

    <!-- Workstream Description -->
    ${descBlock}

    <!-- Weekly Status (stacked rows so Commentary uses full width and the
         Accomplishments / Upcoming pair stretches across the same width below) -->
    <div class="weekly-card">

      <!-- ROW 1 - status strip (Overall Status + Week Progress side-by-side),
           plus the Open Items counters table below -->
      <div class="weekly-row">
        <div class="ws-status-strip">
          <div class="ws-status-block">
            <div class="section-label">Overall Status</div>

/* ╔══════════════════════════════════════════════════════════════════════╗
   ║  ACTIONS / DECISIONS / DEPENDENCIES / RISKS                          ║
   ║  ──────────────────────────────────────────────────────              ║
   ║  Sourced exclusively from TRACKER (TMO Tracker.xlsx).                ║
   ║  Columns and rows are rendered to mirror the spreadsheet exactly.    ║
   ╚══════════════════════════════════════════════════════════════════════╝ */
function renderActionsDecisions() {
  // Map a free-text status from the spreadsheet into a CSS class for the badge
  const statusClass = (s) => {
    const v = String(s || '').toLowerCase().trim();
    if (v === 'done' || v === 'complete' || v === 'completed' || v === 'closed' || v === 'resolved') return 'complete';
    if (v === 'in progress' || v === 'in-progress' || v === 'wip')                                  return 'in-progress';
    if (v === 'overdue')                                                                            return 'overdue';
    if (v === 'at risk' || v === 'at-risk')                                                         return 'overdue';
    if (v === 'blocked')                                                                            return 'overdue';
    if (v === 'open' || v === 'pending' || v === 'new' || v === 'not started')                      return 'open';
    return 'open';
  };

  // Sort actions by status so "live" items rise: overdue/open/in-progress before done
  const actionStatusOrder = { 'overdue': 0, 'open': 1, 'in-progress': 2, 'complete': 3 };
  const sortedActions = [...TRACKER.actions.rows].sort((a, b) =>
    (actionStatusOrder[statusClass(a.Status)] ?? 9) - (actionStatusOrder[statusClass(b.Status)] ?? 9));

  // Build a generic table from a TRACKER section, columns mirror spreadsheet headers exactly
  const buildTable = (section, rows, opts = {}) => {
    const cols = section.columns;
    const headers = cols.map(c => `<th>${esc(c.toUpperCase())}</th>`).join('');
    const rowsHtml = rows.map(r => {
      const cells = cols.map(c => {
        const v = r[c] ?? '';
        // Status column → badge
        if (/^status$/i.test(c)) {
          if (!v) return `<td></td>`;
          const cls = statusClass(v);
          return `<td><span class="a-status ${cls}">${esc(String(v).toUpperCase())}</span></td>`;
        }
        // ID column → mono
        if (/^id$/i.test(c)) {
          return `<td><span class="alog-id">${esc(v)}</span></td>`;
        }
        // Linked Actions column → mono
        if (/linked actions/i.test(c)) {
          return v ? `<td><span class="alog-id">${esc(v)}</span></td>` : `<td></td>`;
        }
        // Workstream / Dependent WS / Depends On WS / Impacted WS → tag pill
        if (/workstream|impacted ws|dependent ws|depends on ws/i.test(c)) {
          return v ? `<td><span class="pod-tag">${esc(v)}</span></td>` : `<td></td>`;
        }
        // Likelihood / Impact (H/M/L) → small severity pill
        if (/likelihood|impact \(/i.test(c)) {
          if (!v) return `<td></td>`;
          const letter = String(v).trim().charAt(0).toUpperCase();
          const sevCls = letter === 'H' ? 'overdue' : letter === 'M' ? 'in-progress' : 'open';
          return `<td><span class="a-status ${sevCls}">${esc(String(v).toUpperCase())}</span></td>`;
        }
        // Notes / Rationale / Mitigation Plan / Description → muted body text, preserve newlines
        if (/notes|rationale|mitigation|description/i.test(c)) {
          const html = esc(v).replace(/\n/g, '<br>');
          return `<td style="font-size:11px;color:var(--muted);line-height:1.5;">${html}</td>`;
        }
        // Due Date / Date / Date Raised / Target Resolution
        if (/date|target resolution|due/i.test(c)) {
          return `<td style="white-space:nowrap;">${esc(v)}</td>`;
        }
        // Default cell
        return `<td>${esc(v)}</td>`;
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `
      <table class="alog-table">
        <thead><tr>${headers}</tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="${cols.length}" style="padding:16px 20px;font-size:13px;color:var(--muted);text-align:center;">No rows in spreadsheet</td></tr>`}</tbody>
      </table>`;
  };

  // Action counts (using normalised statusClass)
  const acts        = TRACKER.actions.rows;
  const actDone     = acts.filter(a => statusClass(a.Status) === 'complete').length;
  const actInProg   = acts.filter(a => statusClass(a.Status) === 'in-progress').length;
  const actOpen     = acts.filter(a => statusClass(a.Status) === 'open').length;
  const actBlank    = acts.filter(a => !a.Status).length;

  // Build distinct workstream filter options from actions sheet
  const wsOptions = [...new Set(acts.map(a => a.Workstream).filter(Boolean))]
    .map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');

  // Risk severity counts (from Likelihood × Impact when both H/M/L present, else from Status)
  const risksRows  = TRACKER.risks.rows;
  const depRows    = TRACKER.dependencies.rows;
  const decRows    = TRACKER.decisions.rows;
  const depAtRisk  = depRows.filter(d => /at risk|at-risk|blocked/i.test(d.Status || '')).length;
  const riskAtRisk = risksRows.filter(r => /at risk|at-risk|high/i.test((r.Status || '') + ' ' + (r['Impact (H/M/L)'] || ''))).length;

  // Identify rows that were marked closed in this refresh - surfaces as a callout above the Actions table
  const recentlyClosedIds  = (typeof RECENTLY_CLOSED_IDS !== 'undefined') ? RECENTLY_CLOSED_IDS : [];
  const recentlyClosedRows = acts.filter(a => recentlyClosedIds.includes(a.ID));
  const refreshMeta        = (typeof TRACKER_LAST_REFRESH !== 'undefined') ? TRACKER_LAST_REFRESH : { date: DATA.lastUpdated, source: 'TMO Tracker.xlsx' };

  const recentlyClosedCallout = recentlyClosedRows.length ? `
    <div class="alog-card" style="margin-bottom:16px;border-color:#86EFAC;background:#F0FDF4;">
      <div class="alog-header" style="background:#DCFCE7;border-bottom:1px solid #86EFAC;">
        <h3 style="color:#14532D;">&#10003; Closed Since Last Refresh</h3>
        <span class="alog-count" style="color:#166534;">${recentlyClosedRows.length} action${recentlyClosedRows.length === 1 ? '' : 's'} moved to Done in ${esc(refreshMeta.source)}</span>
      </div>
      <table class="alog-table">
        <thead><tr><th>ID</th><th>WORKSTREAM</th><th>ACTION</th><th>OWNER</th><th>RAISED IN</th></tr></thead>
        <tbody>${recentlyClosedRows.map(a => `
          <tr style="background:#F0FDF4;">
            <td><span class="alog-id">${esc(a.ID)}</span></td>
            <td>${a.Workstream ? `<span class="pod-tag">${esc(a.Workstream)}</span>` : ''}</td>
            <td style="text-decoration:line-through;color:#166534;">${esc(a.Action)}</td>
            <td>${esc(a.Owner)}</td>
            <td style="font-size:11px;color:var(--muted);">${esc(a['Raised In'] || '')}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>` : '';

  return `
    <div class="ov-title">Actions, Decisions, Dependencies &amp; Risks</div>
    <div class="ov-sub">Sourced exclusively from <strong>${esc(refreshMeta.source)}</strong> · ${acts.length} actions · ${decRows.length} decisions · ${depRows.length} dependencies · ${risksRows.length} risks · Last refreshed ${esc(refreshMeta.date)}</div>

    ${recentlyClosedCallout}

    <!-- ═══ ACTIONS ═══ -->
    <div class="alog-card" style="margin-bottom:16px">
      <div class="alog-header">
        <h3>Actions</h3>
        <span class="alog-count">${acts.length} items · ${actOpen} open · ${actInProg} in progress · ${actDone} done${actBlank ? ` · ${actBlank} blank status` : ''}</span>
      </div>
      <div style="padding:10px 16px 0;border-bottom:1px solid var(--border);">
        <div class="alog-filters">
          <select id="filter-pod" onchange="applyTrackerActionFilters()">
            <option value="">All Workstreams</option>
            ${wsOptions}
          </select>
          <select id="filter-status" onchange="applyTrackerActionFilters()">
            <option value="">All Statuses</option>
            <option value="open">Open</option>
            <option value="in progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>
      <div id="tracker-actions-table">${(() => {
        // Render Actions table with same column order as spreadsheet, sorted by status priority
        return buildTable(TRACKER.actions, sortedActions);
      })()}</div>
    </div>

    <!-- ═══ DECISIONS ═══ -->
    <div class="alog-card" style="margin-bottom:16px">
      <div class="alog-header" style="background:#F0F9FF;border-bottom:1px solid #BAE6FD;">
        <h3 style="color:#0C4A6E">&#9654; Decisions</h3>
        <span class="alog-count">${decRows.length} recorded</span>
      </div>
      ${buildTable(TRACKER.decisions, decRows)}
    </div>

    <!-- ═══ DEPENDENCIES ═══ -->
    <div class="alog-card" style="margin-bottom:16px">
      <div class="alog-header" style="background:#FEF9EE;border-bottom:1px solid #FDE68A;">
        <h3 style="color:#92400E">&#9888; Dependencies</h3>
        <span class="alog-count">${depRows.length} recorded${depAtRisk ? ` · ${depAtRisk} at risk` : ''}</span>
      </div>
      ${buildTable(TRACKER.dependencies, depRows)}
    </div>

    <!-- ═══ RISKS ═══ -->
    <div class="alog-card" style="margin-bottom:0">
      <div class="alog-header" style="background:#FFF5F5;border-bottom:1px solid #FECACA;">
        <h3 style="color:#7F1D1D">&#9888; Risks</h3>
        <span class="alog-count">${risksRows.length} recorded${riskAtRisk ? ` · ${riskAtRisk} at risk` : ''}</span>
      </div>
      ${buildTable(TRACKER.risks, risksRows)}
    </div>`;
}

function renderOverview() {
  // Stats
  const total    = DATA.pods.length;
  const onTrack  = DATA.pods.filter(p => p.overallStatus === 'on-track').length;
  const atRisk   = DATA.pods.filter(p => p.overallStatus === 'at-risk').length;
  const blocked  = DATA.pods.filter(p => p.overallStatus === 'blocked').length;
  const openActs = DATA.actionLog.filter(a => a.status !== 'complete').length;

  const overdueActs  = DATA.actionLog.filter(a => a.status === 'overdue').length;
  const ewTotal   = DATA.enablingWorkstreams.length;
  const ewBlocked = DATA.enablingWorkstreams.filter(e => e.status === 'blocked').length;
  const ewAtRisk  = DATA.enablingWorkstreams.filter(e => e.status === 'at-risk').length;
  const ewCls     = ewBlocked > 0 ? 'red' : ewAtRisk > 0 ? 'orange' : 'green';
  const stats = `
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num navy">${total}</div><div class="stat-lbl">Pods</div></div>
      <div class="stat-box"><div class="stat-num green">${onTrack}</div><div class="stat-lbl">On Track</div></div>
      <div class="stat-box"><div class="stat-num orange">${atRisk}</div><div class="stat-lbl">At Risk</div></div>
      <div class="stat-box"><div class="stat-num ${ewCls}">${ewTotal}</div><div class="stat-lbl">Enabling Workstreams</div></div>
      <div class="stat-box"><div class="stat-num teal">${openActs}</div><div class="stat-lbl">Open Actions</div></div>
      <div class="stat-box"><div class="stat-num red">${overdueActs}</div><div class="stat-lbl">Overdue</div></div>
    </div>`;

  // Merged pod + workstream status cards
  const mergedCards = DATA.pods.map(pod => {
    const topRisks = pod.risks.slice(0,2).map(r =>
      `<span class="pc-risk-tag">${esc(r.title.split(' ').slice(0,4).join(' '))}…</span>`).join('');
    const stLbl = statusLabel[pod.overallStatus] || pod.overallStatus.toUpperCase();

    // Split status quote into bullets at sentence boundaries
    const quoteBullets = pod.statusQuote
      .split(/(?<=[\.])\s+(?=[A-Z])/)        // split on ". " before capitalised next sentence
      .map(s => s.trim().replace(/\.$/, ''))  // trim and drop trailing period
      .filter(s => s.length > 0);
    const bulletsHtml = `<ul class="mpc-bullets">${
      quoteBullets.map(b => `<li><span>${esc(b)}</span></li>`).join('')
    }</ul>`;

    return `
      <div class="merged-pod-card" onclick="switchTab('${pod.id}')">
        <div class="mpc-top">
          <div class="pc-header" style="padding:0 0 8px;">
            <div class="pc-name">${esc(pod.name)}</div>
            <div class="pc-status-dot ${pod.overallStatus}" title="${stLbl}"></div>
          </div>
          <div class="pc-meta">${esc(pod.week)} · ${esc(pod.sprint)}</div>
          <div class="pc-bar" style="margin-top:8px;"><div class="pc-bar-fill ${pod.overallStatus}" style="width:${pod.weekProgress.pct}%"></div></div>
          <div class="pc-pct">${pod.weekProgress.pct}% complete - Week ${pod.weekProgress.current} of ${pod.weekProgress.total}</div>
          ${pod.risks.length ? `<div class="pc-risks">${topRisks}</div>` : ''}
        </div>
        <div class="mpc-divider"></div>
        <div class="mpc-bottom">
          <div class="mpc-status-row">
            <span class="exec-ws-badge ${pod.overallStatus}">${stLbl}</span>
          </div>
          ${bulletsHtml}
        </div>
      </div>`;
  }).join('');

  let commentaryBody = '';
  if (Array.isArray(DATA.programCommentary)) {
    commentaryBody = `<ul style="margin:0;padding:0;list-style:none;font-size:13px;line-height:1.55;color:var(--body)">${
      DATA.programCommentary.map(item => {
        const isString = typeof item === 'string';
        const label    = isString ? '' : (item.label || '');
        const text     = isString ? item : (item.text || '');
        return `<li style="display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border)">
          <span style="color:var(--accent);font-weight:700;flex-shrink:0;line-height:1.55;">▸</span>
          <span>${label ? `<strong style="color:var(--navy)">${esc(label)}:</strong> ` : ''}${esc(text)}</span>
        </li>`;
      }).join('')
    }</ul>`;
  } else if (DATA.programCommentary) {
    commentaryBody = `<p style="margin:0;font-size:13px;line-height:1.7;color:var(--body)">${esc(DATA.programCommentary)}</p>`;
  }
  const commentaryHtml = commentaryBody ? `
    <div class="exec-col-card" style="margin-bottom:18px;border-left:3px solid var(--accent);padding:14px 18px;">
      <div class="exec-col-head" style="color:var(--navy);margin-bottom:8px;">&#128203; Programme Commentary</div>
      ${commentaryBody}
    </div>` : '';

  return `
    ${renderExecSummaryHeader()}
    ${stats}
    ${commentaryHtml}
    <div style="background:white;border:1px solid var(--border);border-radius:8px;padding:16px 22px;margin-bottom:18px;">
      <div class="exec-section-label" style="margin-bottom:12px;">Workstreams</div>
      <div class="merged-pods-row" style="margin-bottom:0;">${mergedCards}</div>
    </div>
    ${renderEnablingWorkstreams()}
    ${renderExecSummaryBody()}`;
}

/* ╔══════════════════════════════════════════════════════════════════════╗
   ║  BOARD VIEW - exec-friendly tab                                      ║
   ║  ────────────────────────────────────────────────                    ║
   ║  Three sections, all visual-led:                                     ║
   ║    1. Program Pulse strip (status + week + quick stats)              ║
   ║    2. Milestone Plan grid (4 workstreams × 5 stages)                 ║
   ║    3. Updates / Risks / Dependencies trio                            ║
   ╚══════════════════════════════════════════════════════════════════════╝ */
function renderBoardView() {
  const STAGE_LABELS = ["Sprint 0\nDiscovery", "Innovation\nWorkshop", "Build\nSprint", "Pilot &\nValidation", "Train &\nDeploy"];
  const ownLabel = { lead: "LEAD", oversight: "OVERSIGHT", partner: "PARTNER", enabling: "ENABLING" };

  /* Architecture is now treated as a 5th workstream in the Executive Summary -
     surfaced alongside the 4 build pods in the pulse counts, headlines, and
     milestone matrix. Defined once here so all three sections can reference it. */
  const architectureRow = {
    id:            'architecture',
    name:          'Architecture',
    ownership:     'enabling',
    overallStatus: (DATA.architecture && DATA.architecture.weekStatus) || 'on-track',
    week:          'CROSS-CUTTING',
    sprint:        'PLATFORM ENABLING',
    statusQuote:   'Pending final sign-off of architecture by Thom W/C 04 May',
    keyMilestone30Day: 'Target state technology architecture agreed with Accordion and build started on the agreed architecture pattern',
    keyMilestone60Day: 'To be agreed',
    risks:         [],            // Architecture risks live in DATA.architecture.blockers - not aggregated into pod risks
    podDependencies: [],

      { sprintLabel: "Week 8", status: "upcoming", milestones: [] },
      { sprintLabel: "Week 9", status: "upcoming", milestones: [] }
    ],




  };

  // All workstreams for pulse counts and headlines (4 pods + Architecture)
  const allWorkstreams = [...DATA.pods, architectureRow];

  /* ── PROGRAM PULSE ─────────────────────────────────────────────────── */
  const total    = allWorkstreams.length;
  const onTrack  = allWorkstreams.filter(p => p.overallStatus === 'on-track').length;
  const atRisk   = allWorkstreams.filter(p => p.overallStatus === 'at-risk').length;
  const blocked  = allWorkstreams.filter(p => p.overallStatus === 'blocked').length;

  // Roll up overall program status - worst child wins
  const programStatus = blocked > 0 ? 'blocked' : atRisk > 0 ? 'at-risk' : 'on-track';
  const programLabel  = { 'on-track':'ON TRACK', 'at-risk':'AT RISK', 'blocked':'BLOCKED' }[programStatus];
  const programIcon   = { 'on-track':'&#10003;', 'at-risk':'!', 'blocked':'&#10005;' }[programStatus];

  // Aggregate risk count - sourced from TRACKER.risks (all rows with a description, not resolved)
  // Mirror the Exec Summary suppression list below so the stat count matches the visible list.
  const HIDE_FROM_EXEC = new Set(['R-006']);
  const highRisks = (TRACKER.risks.rows || []).filter(r => {
    const desc = (r['Risk Description'] || '').trim();
    if (HIDE_FROM_EXEC.has((r.ID || '').trim())) return false;
    return desc !== '' && !/^resolved$/i.test((r.Status || '').trim());
  }).length;

  // Aggregate dependency count - sourced from TRACKER.dependencies (not resolved)
  const openDeps = (TRACKER.dependencies.rows || []).filter(d => {
    const desc = (d.Description || '').trim();
    return desc !== '' && !/^resolved$/i.test((d.Status || '').trim());
  }).length;

  // Decisions needed - sourced from TRACKER.decisions (rows with content, not resolved)
  const openDecisions = (TRACKER.decisions.rows || []).filter(r => {
    const dec = (r['Decision required'] || r.Decision || '').trim();
    return dec !== '' && !/^resolved$/i.test((r.Status || '').trim());
  }).length;

  // Use the longest pod timeline as the program timeline
  const maxWeek = Math.max(...DATA.pods.map(p => p.weekProgress.total));
  const curWeek = Math.max(...DATA.pods.map(p => p.weekProgress.current));

  // Animated ring helper — SVG donut ring, animates stroke on load
  const CIRC = 2 * Math.PI * 26; // circumference for r=26
  const ringColor = (st) => ({ 'on-track': '#22C55E', 'complete': '#22B89E', 'at-risk': '#F59E0B', 'blocked': '#EF4444' })[st] || '#22C55E';
  const ringPct = (pod) => {
    const allMiles = (pod.sprintMilestones || []).flatMap(s => s.milestones || []);
    const total = allMiles.length;
    if (total === 0) return 0;
    const done = allMiles.filter(m => { const v = String(m.status||'').toLowerCase(); return v.includes('complete') || v === 'done'; }).length;
    return Math.round((done / total) * 100);
  };

  const ringHtml = allWorkstreams.map(pod => {
    const pct   = ringPct(pod);
    const color = ringColor(pod.overallStatus);
    const offset = CIRC * (1 - pct / 100);
    const shortName = pod.name;
    return `
      <div class="bv-ring-item">
        <svg width="64" height="64" viewBox="0 0 64 64" style="display:block;margin:0 auto;">

      </div>`;
  }).join('');

  const pulse = `
    <div class="bv-pulse2">
      <div class="bv-stat-callouts">
        <div class="bv-stat-block">
          <div class="bv-stat-num"><span style="background:linear-gradient(to right, var(--green) 50%, var(--amber) 50%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900;">${onTrack}</span><span class="bv-stat-denom">/${total}</span></div>

        <div class="bv-stat-divider"></div>
        <div class="bv-stat-block">
          <div class="bv-stat-num"><span class="${openDeps > 2 ? 'red' : openDeps > 0 ? 'amber' : 'green'}">${openDeps}</span></div>
          <div class="bv-stat-lbl">Open Dependencies</div>
        </div>
        <div class="bv-stat-divider"></div>
        <div class="bv-stat-block">
          <div class="bv-stat-num"><span class="${openDecisions > 0 ? 'amber' : 'green'}">${openDecisions}</span></div>
          <div class="bv-stat-lbl">Decisions Needed</div>

      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
        <div class="bv-rings-strip">${ringHtml}</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.5);text-align:right;max-width:420px;line-height:1.4;">% = completed sprint milestone items as a share of all milestone items entered in the week-by-week plan</div>
      </div>
    </div>`;

  /* ── MILESTONE MATRIX ROWS ─────────────────────────────────────────── */
  // milestoneEntries reuses allWorkstreams so Architecture appears as the 5th row
  const milestoneEntries = allWorkstreams;

  // Build a unified sprint axis - take the max number of sprints across all rows so columns line up
  const allSprintCounts = milestoneEntries.map(p => (p.sprintMilestones || []).length);
  const maxSprints = Math.max(0, ...allSprintCounts);

  // Use the first row that has the longest list for the column headers; fallback gracefully
  const headerPod = milestoneEntries.find(p => (p.sprintMilestones || []).length === maxSprints) || milestoneEntries[0];
  const headerSprintsRaw = headerPod && headerPod.sprintMilestones ? headerPod.sprintMilestones : [];
  // Remove Week 6 and beyond - these columns are empty
  const headerSprints = headerSprintsRaw.filter(sp => {
    const num = parseInt((sp.sprintLabel || '').replace(/\D/g, ''), 10);
    return isNaN(num) || (num >= 0 && num <= 4);
  });

  // Map sprint labels to w/c dates (Week 0 = w/c 27 Apr 2026)
  const weekDateMap = {
    'Week 0': '27 Apr', 'Week 1': '4 May',  'Week 2': '11 May',
    'Week 3': '18 May', 'Week 4': '25 May', 'Week 5': '1 Jun',
    'Week 6': '8 Jun',  'Week 7': '15 Jun', 'Week 8': '22 Jun'
  };
  const dateLabel = (lbl) => {
    const date = weekDateMap[lbl];
    return date ? `w/c ${date}` : lbl;
  };

  const sprintHeaderHtml = headerSprints.map(sp => `
    <th class="bv-sp-col-h ${sp.status}" data-sprint-status="${sp.status}" data-sprint-label="${esc(sp.sprintLabel)}">
      <div class="bv-sp-label">
        ${dateLabel(esc(sp.sprintLabel))}
        <span class="bv-sp-label-tag ${sp.status}">${sp.status === 'current' ? 'NOW' : sp.status === 'complete' ? 'DONE' : 'NEXT'}</span>
      </div>
    </th>`).join('');

  const milestoneStatusClass = (s) => {
    const v = String(s || '').toLowerCase();
    if (v.includes('complete') || v === 'done') return 'complete';
    if (v.includes('in-progress') || v.includes('progress')) return 'in-progress';
    if (v.includes('at-risk') || v.includes('risk') || v === 'blocked') return 'at-risk';
    return 'not-started';
  };

  const sprintRows = milestoneEntries.map(pod => {
    const ownLbl = ownLabel[pod.ownership] || pod.ownership.toUpperCase();
    const sprints = pod.sprintMilestones || [];
    // Map by sprintLabel for column alignment, fallback to position
    const cellsHtml = headerSprints.map((header, i) => {
      const sp = sprints.find(s => s.sprintLabel === header.sprintLabel) || sprints[i];
      if (!sp || !sp.milestones || !sp.milestones.length) {
        return `<td class="bv-sp-cell ${header.status}"><div class="bv-sp-empty"></div></td>`;
      }
      const milesHtml = sp.milestones.map(m => {
        const mCls = milestoneStatusClass(m.status);
        const isTbd = /\[TBD\]/i.test(m.text);
        const tickHtml = mCls === 'complete'
          ? `<span class="bv-sp-mile-tick">&#10003;</span>`
          : `<div class="bv-sp-mile-dot ${mCls}"></div>`;
        return `
          <div class="bv-sp-mile">
            ${tickHtml}
            <div class="bv-sp-mile-text${isTbd ? ' tbd' : ''}">${esc(m.text)}</div>
          </div>`;
      }).join('');
      return `<td class="bv-sp-cell ${sp.status || header.status}">${milesHtml}</td>`;
    }).join('');

    return `
      <tr>
        <td class="bv-sp-ws-cell">
          <div class="bv-sp-ws-row">
            <span class="bv-sp-ws-rag ${pod.overallStatus}"></span>
            <span class="bv-sp-ws-name">${esc(pod.name)}</span>
          </div>
        </td>
        ${cellsHtml}
      </tr>`;
  }).join('');

  const milestoneCard = `
    <div class="bv-sprint-card">
      <div class="bv-card-head">
        <div>
          <div class="bv-card-title">Key Milestones by Workstream and Week</div>
          <div class="bv-card-sub">Week-level milestone plan · scroll &rarr; for upcoming weeks · placeholder content marked [TBD] until plans are finalised</div>
        </div>
        <div class="bv-legend">
          <div class="bv-legend-item"><span style="color:var(--green);font-weight:900;font-size:13px;line-height:1;">&#10003;</span>&nbsp;Completed</div>
          <div class="bv-legend-item"><div class="bv-legend-dot" style="background:var(--green);border-radius:50%;"></div>In Progress</div>
          <div class="bv-legend-item"><div class="bv-legend-dot" style="background:var(--amber);border-radius:50%;"></div>At Risk</div>
          <div class="bv-legend-item"><div class="bv-legend-dot" style="background:var(--red);border-radius:50%;"></div>Blocked</div>
          <div class="bv-legend-item"><div class="bv-legend-dot" style="background:#9CA3AF;border-radius:50%;"></div>Not Started</div>
        </div>
      </div>

                ${sprintHeaderHtml}
              </tr>
            </thead>
            <tbody>${sprintRows}</tbody>
          </table>
        </div>
      </div>
    </div>`;

  /* ── HEADLINES (full-width, top of page) ───────────────────────────── */
  // One short headline per workstream - derived from statusQuote first sentence
  const headlineTiles = allWorkstreams.map(pod => {
    const headline = (pod.statusQuote || '')
      .split(/(?<=[\.])\s+(?=[A-Z])/)[0]   // first sentence
      .replace(/\.$/, '')
      .trim();
    return `
      <div class="bv-headline-tile ${pod.overallStatus}">
        <div class="bv-headline-ws">

  const headlinesCard = `
    <div class="bv-headlines-card">
      <div class="bv-card-head" style="margin-bottom:14px;">
        <div>
          <div class="bv-card-title">This Week's Headlines</div>

  /* Render a milestone-string with optional bracketed caveat (e.g. "[as of March '26]")
     pulled into a muted italic span so it reads as provenance metadata. */
  const formatMilestoneText = (text) => {
    const m = text.match(/^(.*?)(\[as of [^\]]+\])\s*$/);
    if (m) {
      return `${esc(m[1].trimEnd())} <span class="source-caveat">${esc(m[2])}</span>`;
    }
    return esc(text);
  };

  /* Normalise a milestone string for variance comparison - strip the caveat and
     collapse whitespace so "X. [as of March '26]" matches plain "X." */
  const normaliseForCompare = (text) => {
    return (text || '')
      .replace(/\s*\[as of [^\]]+\]\s*$/i, '')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  };

  /* Build the variance note shown beneath a milestone tile when the lead-submitted
     content differs from the March '26 PDF plan. */
  const renderVarianceNote = (currentText, pdfText) => {
    if (!pdfText) return '';
    if (normaliseForCompare(currentText) === normaliseForCompare(pdfText)) return '';
    return `
      <div class="bv-variance-note">
        <span class="label">&#9888; Variance vs March '26 plan</span>

  };

  /* ── COMBINED 30 / 60 DAY MILESTONE GRID ──────────────────────────── */
  // Today = 3 May 2026. Week 0 w/c 27 Apr 2026. Days elapsed since 27 Apr.
  const programStart = new Date('2026-04-27');
  const today = new Date('2026-05-03');
  const daysElapsed = Math.round((today - programStart) / 86400000);

  // Helper: inline confidence icon (circle only) prepended to each bullet point
  const confInline = (status, isTbd) => {

  };

  const horizonRows = allWorkstreams.map(pod => {
    const text30 = pod.keyMilestone30Day || '[TBD] 30-day milestone pending';

    const isTbd30 = /^\[TBD\]/i.test(text30);
    const isTbd60 = /^\[TBD\]/i.test(text60);
    const st = pod.overallStatus;
    const pct30 = Math.min(100, Math.round((daysElapsed / 30) * 100));
    const pct60 = Math.min(100, Math.round((daysElapsed / 60) * 100));
    const statusLabel30 = { 'on-track': 'ON TRACK', 'at-risk': 'AT RISK', 'blocked': 'BLOCKED', 'complete': 'COMPLETE' }[st] || st.toUpperCase();
    return `
      <tr>
        <td class="bv-horizon-ws-cell">
          <div class="bv-horizon-ws-name-row">
            <span class="bv-horizon-ws-dot ${st}"></span>
            <span class="bv-horizon-ws-label">${esc(pod.name)}</span>
          </div>
          <span class="bv-horizon-ws-status ${st}">${statusLabel30}</span>
        </td>
        <td class="bv-horizon-mile-cell col-30">
          <div class="bv-horizon-mile-text${isTbd30 ? ' tbd' : ''}">${bulletize(text30, isTbd30 ? 'tbd' : '', confInline(st, isTbd30))}</div>
          <div class="bv-horizon-bar-wrap">
            <div class="bv-horizon-bar-label">
              <span class="days-gone">${daysElapsed} days in</span>
              <span>${30 - daysElapsed > 0 ? (30 - daysElapsed) + ' days remaining' : 'Window reached'}</span>
            </div>
            <div class="bv-horizon-track"><div class="bv-horizon-fill ${st}" style="width:${pct30}%"></div></div>
          </div>
        </td>
        <td class="bv-horizon-mile-cell col-60">
          <div class="bv-horizon-mile-text${isTbd60 ? ' tbd' : ''}">${bulletize(text60, isTbd60 ? 'tbd' : '', confInline(st, isTbd60))}</div>
          <div class="bv-horizon-bar-wrap">
            <div class="bv-horizon-bar-label">
              <span class="days-gone">${daysElapsed} days in</span>
              <span>${60 - daysElapsed > 0 ? (60 - daysElapsed) + ' days remaining' : 'Window reached'}</span>
            </div>
            <div class="bv-horizon-track"><div class="bv-horizon-fill ${st}" style="width:${pct60}%"></div></div>
          </div>
        </td>
      </tr>`;
  }).join('');

  const milestoneHorizonCard = `
    <div class="bv-horizon-card">
      <div class="bv-card-head" style="margin-bottom:14px;">
        <div>
          <div class="bv-card-title">30/60 Day Outcomes by Workstream</div>
          <div class="bv-card-sub">Key outcomes per workstream over the next 30 and 60 days · placeholder content marked [TBD] until lead input</div>
        </div>
        <div class="bv-horizon-legend">
          <div class="bv-horizon-legend-item"><span class="bv-conf-inline on-track" style="display:inline-flex;width:16px;height:16px;border-radius:50%;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:white;background:var(--green);">&#10003;</span>On track to deliver</div>
          <div class="bv-horizon-legend-item"><span class="bv-conf-inline at-risk"  style="display:inline-flex;width:16px;height:16px;border-radius:50%;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:white;background:var(--orange);">!</span>At risk of delivery</div>
          <div class="bv-horizon-legend-item"><span class="bv-conf-inline blocked"  style="display:inline-flex;width:16px;height:16px;border-radius:50%;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:white;background:var(--red);">&#10005;</span>Delivery blocked</div>
          <div class="bv-horizon-legend-item"><span class="bv-conf-inline tbd"      style="display:inline-flex;width:16px;height:16px;border-radius:50%;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:white;background:#9CA3AF;">?</span>Not yet defined</div>
        </div>
      </div>
      <table class="bv-horizon-table">
        <thead>
          <tr>
            <th>Workstream</th>
            <th class="col-30">&#9650; 30-Day Outcomes <span style="font-weight:500;opacity:0.7;">(end May)</span></th>
            <th class="col-60">&#9650; 60-Day Outcomes <span style="font-weight:500;opacity:0.7;">(end June)</span></th>
          </tr>
        </thead>
        <tbody>${horizonRows}</tbody>
      </table>
    </div>`;

  /* RISKS / DEPENDENCIES / DECISIONS TRIO (3 cards) */

  // Risks: sourced from TRACKER.risks (not resolved), sorted by impact then likelihood
  // Exec Summary suppression list - risks tracked in the Actions & Decisions tab but
  // intentionally hidden from the board-level view (e.g. operational/working-approach
  // items rather than true delivery risks).
  const EXEC_RISK_HIDE = new Set(['R-006']);
  const impactOrder = { h: 0, high: 0, m: 1, medium: 1, l: 2, low: 2, '': 3 };
  const allRisks = (TRACKER.risks.rows || []).filter(r => {
    const desc = (r['Risk Description'] || '').trim();
    if (EXEC_RISK_HIDE.has((r.ID || '').trim())) return false;
    return desc !== '' && !/^resolved$/i.test((r.Status || '').trim());
  });
  allRisks.sort((a, b) =>
    (impactOrder[(a['Impact (H/M/L)'] || '').toLowerCase()] ?? 3) -
    (impactOrder[(b['Impact (H/M/L)'] || '').toLowerCase()] ?? 3)
  );
  const topRisks = allRisks.slice(0, 8);
  const riskRows = topRisks.map(r => {
    const impact     = (r['Impact (H/M/L)'] || '').trim();
    const likelihood = (r['Likelihood (H/M/L)'] || '').trim();
    const impLow     = impact.toLowerCase();
    const impCls     = impLow === 'h' || impLow === 'high'   ? 'impact-h'
                     : impLow === 'm' || impLow === 'medium' ? 'impact-m' : 'impact-l';
    const impLabel   = impact ? `Impact: ${impact}` : 'Impact: ?';
    const likeLabel  = likelihood ? `Likelihood: ${likelihood}` : '';
    return `
    <div class="bv-risk-row">
      <div class="bv-risk-content">
        <div class="bv-risk-pills">
          <span class="bv-risk-pill ${impCls}">${impLabel}</span>
          ${likeLabel ? `<span class="bv-risk-pill likelihood">${likeLabel}</span>` : ''}
        </div>
        <div class="bv-risk-title">${esc(r['Risk Description'])}</div>
        <div class="bv-risk-meta">
          <span class="bv-risk-tag">${esc(r['Impacted WS'] || 'Cross-workstream')}</span>
          ${r['Date Raised'] ? `<span class="bv-meta-date">&#128197; ${esc(r['Date Raised'])}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  // Dependencies: sourced from TRACKER.dependencies (not resolved)
  const todayNow = new Date();
  const allDeps = (TRACKER.dependencies.rows || []).filter(d => {
    const desc = (d.Description || '').trim();
    return desc !== '' && !/^resolved$/i.test((d.Status || '').trim());
  });
  const depRows = allDeps.map(d => {
    const targetRaw = (d['Target Resolution'] || '').trim();
    const targetDate = targetRaw ? new Date(targetRaw) : null;
    const isOverdue = targetDate && !isNaN(targetDate) && targetDate < todayNow;
    const targetFmt = targetDate && !isNaN(targetDate)
      ? targetDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
      : targetRaw;
    return `
    <div class="bv-dep-row">
      <div class="bv-dep-icon">&#128279;</div>
      <div class="bv-dep-content">
        <div class="bv-dep-title">${isOverdue ? `<span class="bv-dep-overdue">OVERDUE</span>` : ''}${esc(d.Description)}</div>
        ${targetFmt ? `<div class="bv-dep-dates"><span class="bv-meta-date target">&#127919; Target ${esc(targetFmt)}</span></div>` : ''}
      </div>
    </div>`;
  }).join('');

  // Decisions: open decisions from TRACKER
  const openDecsList = (TRACKER.decisions.rows || []).filter(r => {
    const dec = (r['Decision required'] || r.Decision || '').trim();
    return dec !== '' && !/^resolved$/i.test((r.Status || '').trim());
  });
  const decisionRows = openDecsList.map(d => {
    const text  = (d['Decision required'] || d.Decision || '').trim();
    const ws    = (d.Workstream || '').trim();
    const raised = (d['Date Raised'] || '').trim();
    return `
    <div class="bv-dep-row">
      <div class="bv-dep-icon">&#9888;</div>
      <div class="bv-dep-content">
        <div class="bv-dep-title">${esc(text)}</div>
        <div class="bv-dep-meta">
          ${ws ? `<span class="bv-risk-tag">${esc(ws)}</span>` : ''}
          ${raised ? `<span class="bv-meta-date">&#128197; Raised ${esc(raised)}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  const trio = `
    <div class="bv-trio">
      <div class="bv-trio-card">
        <div class="bv-trio-head red">
          <div class="bv-trio-title"><span class="dot red"></span>Open Risks</div>
          <span class="bv-trio-count red">${allRisks.length}</span>
        </div>
        <div class="bv-trio-body">${riskRows || '<div style="font-size:12px;color:var(--muted);padding:14px 0;">No active risks</div>'}</div>
      </div>
      <div class="bv-trio-card">
        <div class="bv-trio-head amber">
          <div class="bv-trio-title"><span class="dot amber"></span>Open Dependencies</div>
          <span class="bv-trio-count amber">${allDeps.length}</span>
        </div>
        <div class="bv-trio-body">${depRows || '<div style="font-size:12px;color:var(--muted);padding:14px 0;">No open dependencies</div>'}</div>
      </div>
      <div class="bv-trio-card">
        <div class="bv-trio-head amber">
          <div class="bv-trio-title"><span class="dot amber" style="background:var(--navy)"></span>Decisions Needed</div>
          <span class="bv-trio-count amber">${openDecsList.length}</span>
        </div>
        <div class="bv-trio-body">${decisionRows || '<div style="font-size:12px;color:var(--muted);padding:14px 0;">No open decisions</div>'}</div>
      </div>
    </div>`;

  /* ── WORKSTREAM HEALTH MATRIX ──────────────────────────────────────── */
  const hmDimensions = ['Delivery Milestones', 'Open Risks', 'Open Dependencies'];
  const hmStatusForPod = (pod) => {
    // (1) Delivery Milestones: AI Solutions, FoF, BT&T, AI Biz Ops = on-track; Architecture = at-risk
    const isArch = /architect/i.test(pod.name);
    const mileSt = isArch ? 'at-risk' : 'on-track';
    // (2) Open Risks: all workstreams have open risks = at-risk
    const riskSt = 'at-risk';
    // (3) Open Dependencies: all at-risk except AI Biz Ops which has no open deps = on-track
    const isBizOps = /biz\s*ops/i.test(pod.name);
    const depSt = isBizOps ? 'on-track' : 'at-risk';
    return [mileSt, riskSt, depSt];
  };
  const hmDotColor = (st) => ({ 'on-track':'var(--green)', 'at-risk':'var(--orange)', 'blocked':'var(--red)', 'complete':'var(--teal)', 'not-started':'#9CA3AF' })[st] || '#9CA3AF';
  const hmSymbol   = (st) => ({ 'on-track':'&#10003;', 'at-risk':'!', 'blocked':'&#10005;', 'complete':'&#10003;', 'not-started':'?' })[st] || '?';

  const hmRows = allWorkstreams.map(pod => {
    const dims = hmStatusForPod(pod);
    const cells = dims.map((st, i) => `
      <td class="bv-hm-cell" title="${hmDimensions[i]}: ${st}">
        <span class="bv-hm-dot" style="background:${hmDotColor(st)}">${hmSymbol(st)}</span>
      </td>`).join('');
    return `
      <tr class="bv-hm-row">
        <td class="bv-hm-ws-cell">
          <span class="bv-hm-ws-rag" style="background:${hmDotColor(pod.overallStatus)}"></span>
          <span class="bv-hm-ws-name">${esc(pod.name)}</span>
        </td>
        ${cells}
      </tr>`;
  }).join('');

  const healthMatrixCard = `
    <div class="bv-hm-card">
      <div class="bv-card-head" style="margin-bottom:12px;">
        <div class="bv-card-title">Workstream Health at a Glance</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start;">
        <table class="bv-hm-table">
          <thead>
            <tr>
              <th class="bv-hm-ws-h">Workstream</th>
              ${hmDimensions.map(d => `<th class="bv-hm-col-h">${d}</th>`).join('')}
            </tr>
          </thead>
          <tbody>${hmRows}</tbody>
        </table>
        <div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:14px 16px;">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px;">
            <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--orange);flex-shrink:0;"></span>
            <span style="font-size:11px;font-weight:700;color:#92400E;text-transform:uppercase;letter-spacing:0.05em;">Amber Signal Drivers</span>
          </div>
          <ul style="margin:0;padding-left:16px;list-style:disc;">
            <li style="font-size:12px;color:#44403C;line-height:1.5;margin-bottom:8px;">Tech architecture alignment outstanding between Accordion, Motive and EM; teams building locally in the interim</li>
            <li style="font-size:12px;color:#44403C;line-height:1.5;margin-bottom:8px;">AxisIQ roadmap risk to FoF rollout pace</li>
            <li style="font-size:12px;color:#44403C;line-height:1.5;">SOC 2 compliance approach under discussion; Accordion leadership meeting 5 May</li>
          </ul>
        </div>
      </div>
    </div>`;

  /* ── MILESTONE TICKER STRIP ────────────────────────────────────────── */
  const endMay  = new Date('2026-05-31');
  const endJune = new Date('2026-06-30');
  const totalDays60 = Math.round((endJune - programStart) / 86400000);
  const pctToEndMay  = Math.min(100, Math.round((daysElapsed / Math.round((endMay  - programStart) / 86400000)) * 100));
  const pctToEndJune = Math.min(100, Math.round((daysElapsed / totalDays60) * 100));

  const tickerStatusColor = (st) => ({ 'on-track': 'var(--green)', 'at-risk': 'var(--orange)', 'blocked': 'var(--red)', 'complete': 'var(--teal)' })[st] || '#9CA3AF';
  const tickerStatusBg    = (st) => ({ 'on-track': '#DCFCE7', 'at-risk': '#FEF3C7', 'blocked': '#FEE2E2', 'complete': '#CCFBF1' })[st] || '#F3F4F6';
  const tickerStatusText  = (st) => ({ 'on-track': '#14532D', 'at-risk': '#78350F', 'blocked': '#991B1B', 'complete': '#134E4A' })[st] || '#6B7280';

  // Timeline bar — shows today's position between programme start and end of June
  const timelineBar = `
    <div class="bv-ticker-timeline">
      <div class="bv-ticker-tl-bar">
        <div class="bv-ticker-tl-fill" style="width:${Math.min(100, Math.round(daysElapsed / totalDays60 * 100))}%"></div>
        <div class="bv-ticker-tl-today" style="left:${Math.min(98, Math.round(daysElapsed / totalDays60 * 100))}%">
          <div class="bv-ticker-tl-today-pin"></div>
          <div class="bv-ticker-tl-today-lbl">Today</div>
        </div>
        <div class="bv-ticker-tl-marker" style="left:${Math.round(Math.round((endMay - programStart) / 86400000) / totalDays60 * 100)}%">
          <div class="bv-ticker-tl-marker-line"></div>
          <div class="bv-ticker-tl-marker-lbl">End May</div>
        </div>
      </div>
      <div class="bv-ticker-tl-labels">
        <span>w/c 27 Apr</span>
        <span>End June</span>
      </div>
    </div>`;

  const msStatusLabel = (st) => ({ 'on-track':'ON TRACK', 'at-risk':'AT RISK', 'blocked':'BLOCKED', 'complete':'COMPLETE' })[st] || st.toUpperCase();
  const msRows = allWorkstreams.map(pod => {
    const st      = pod.overallStatus;
    const text30  = pod.keyMilestone30Day || '[TBD] 30-day milestone pending';
    const text60  = pod.keyMilestone60Day || '[TBD] 60-day milestone pending';
    const isTbd30 = /^\[TBD\]/i.test(text30);
    const isTbd60 = /^\[TBD\]/i.test(text60);
    return `
      <tr>
        <td class="bv-ms-ws-cell">
          ${esc(pod.name)}
          <span class="bv-ms-status-pill ${st}">${msStatusLabel(st)}</span>
        </td>
        <td class="bv-ms-cell">
          ${bulletize(text30, 'bv-ms-bullet' + (isTbd30 ? ' tbd' : ''), confInline(st, isTbd30))}
        </td>
        <td class="bv-ms-cell bv-ms-cell-60">
          ${bulletize(text60, 'bv-ms-bullet tbd', confInline('not-started', true))}
        </td>
      </tr>`;
  }).join('');

  const milestoneTickerCard = `
    <div class="bv-ms-grid-card">
      <div class="bv-card-head" style="margin-bottom:4px;">
        <div>
          <div class="bv-card-title">30 &amp; 60 Day Delivery Outcomes</div>
          <div class="bv-card-sub">Key targets by workstream &middot; programme timeline below</div>
        </div>
        <div class="bv-horizon-legend">
          <div class="bv-horizon-legend-item"><span style="display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:white;background:var(--green);margin-right:5px;">&#10003;</span>On Track</div>
          <div class="bv-horizon-legend-item"><span style="display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:white;background:var(--amber);margin-right:5px;">!</span>At Risk</div>
          <div class="bv-horizon-legend-item"><span style="display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:white;background:var(--red);margin-right:5px;">&#10005;</span>Blocked</div>
          <div class="bv-horizon-legend-item"><span style="display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:white;background:#9CA3AF;margin-right:5px;">?</span>Not Started</div>
        </div>
      </div>
      ${timelineBar}
      <table class="bv-ms-grid">
        <thead>
          <tr>
            <th class="bv-ms-ws-h">Workstream</th>
            <th class="bv-ms-h30">30-Day Outcomes &nbsp;<span style="font-weight:500;opacity:0.75;">End May 2026</span></th>
            <th class="bv-ms-h60">60-Day Outcomes &nbsp;<span style="font-weight:500;opacity:0.75;">End June 2026</span></th>
          </tr>
        </thead>
        <tbody>${msRows}</tbody>
      </table>
    </div>`;

  return pulse + headlinesCard + healthMatrixCard + milestoneTickerCard + milestoneCard + trio;
}

/* ── TAB SWITCHING ─────────────────────────────────────────────────────── */
function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + id));
  // When showing Executive Summary, scroll the sprint matrix so the CURRENT sprint sits at the left edge
  if (id === 'board-view') {
    // Defer until layout settles; required because the pane was display:none and offsets are 0 until shown
    requestAnimationFrame(() => requestAnimationFrame(scrollSprintMatrixToCurrent));
  }
}

/* Scroll the sprint matrix horizontally so the "current" sprint is the first visible column.
   The sticky workstream column on the left has width 240px + 6px border-spacing; we offset by that. */
function scrollSprintMatrixToCurrent() {
  const scroller = document.getElementById('bv-sprint-scroll');
  if (!scroller) return;
  const stickyOffset = 246; // 240px workstream column + 6px spacing
  const currentHeader = scroller.querySelector('th[data-sprint-status="current"]');
  if (!currentHeader) {
    scroller.scrollLeft = 0;
    return;
  }
  // offsetLeft is relative to the table; we want the current header to land just after the sticky column
  const target = currentHeader.offsetLeft - stickyOffset;
  scroller.scrollLeft = Math.max(0, target);
}

/* ── ACTION LOG FILTERING (Tracker-driven) ─────────────────────────────── */
function applyTrackerActionFilters() {
  const pod    = (document.getElementById('filter-pod')?.value    || '').trim().toLowerCase();
  const status = (document.getElementById('filter-status')?.value || '').trim().toLowerCase();
  // Spreadsheet column order: 0=ID, 1=Workstream, 2=Action, 3=Owner, 4=Due Date, 5=Status, 6=Raised In, 7=Notes
  const rows = document.querySelectorAll('#tracker-actions-table tbody tr');
  rows.forEach(row => {
    const cells = row.querySelectorAll('td');
    if (cells.length < 6) return;
    const rowPod    = (cells[1]?.textContent || '').trim().toLowerCase();
    const rowStatus = (cells[5]?.textContent || '').trim().toLowerCase();
    const podMatch    = !pod    || rowPod === pod;
    const statusMatch = !status || rowStatus === status;
    row.style.display = (podMatch && statusMatch) ? '' : 'none';
  });
}
// Backwards-compat alias - older inline onclicks may still reference applyLogFilters
function applyLogFilters() { applyTrackerActionFilters(); }

/* ── BOOTSTRAP ─────────────────────────────────────────────────────────── */
function init() {
  document.getElementById('hdr-date').textContent = DATA.lastUpdated;

  const nav = document.getElementById('tabs-nav');
  const cont = document.getElementById('panes-container');

  // Executive Summary tab - exec-friendly low-text-density view (FIRST tab, default active)
  const boardBtn = document.createElement('button');
  boardBtn.className = 'tab-btn active';
  boardBtn.dataset.tab = 'board-view';
  boardBtn.innerHTML = '&#9737; Executive Summary';
  boardBtn.onclick = () => switchTab('board-view');
  nav.appendChild(boardBtn);

  const boardPane = document.createElement('div');
  boardPane.className = 'tab-pane active';
  boardPane.id = 'pane-board-view';
  boardPane.innerHTML = renderBoardView();
  cont.appendChild(boardPane);

  // Actions & Decisions tab
  const actBtn = document.createElement('button');
  actBtn.className = 'tab-btn';
  actBtn.dataset.tab = 'actions-decisions';
  actBtn.innerHTML = '&#9635; Actions &amp; Decisions';
  actBtn.onclick = () => switchTab('actions-decisions');
  nav.appendChild(actBtn);

  const actPane = document.createElement('div');
  actPane.className = 'tab-pane';
  actPane.id = 'pane-actions-decisions';
  actPane.innerHTML = renderActionsDecisions();
  cont.appendChild(actPane);

  // Workstreams divider label
  const divider = document.createElement('span');
  divider.className = 'tab-nav-divider';
  divider.textContent = 'Workstreams';
  nav.appendChild(divider);

  // Pod tabs
  DATA.pods.forEach((pod, idx) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.tab = pod.id;
    btn.innerHTML = `<span style="opacity:0.5;font-size:11px;font-weight:600;margin-right:2px;">Pod ${idx + 1} -</span> ${esc(pod.name)}`;
    btn.onclick = () => switchTab(pod.id);
    nav.appendChild(btn);

    const pane = document.createElement('div');
    pane.className = 'tab-pane';
    pane.id = 'pane-' + pod.id;
    pane.innerHTML = renderPod(pod);
    cont.appendChild(pane);
  });

  // Architecture tab
  const archBtn = document.createElement('button');
  archBtn.className = 'tab-btn';
  archBtn.dataset.tab = 'architecture';
  archBtn.innerHTML = '&#9783; Architecture';
  archBtn.onclick = () => switchTab('architecture');
  nav.appendChild(archBtn);

  const archPane = document.createElement('div');
  archPane.className = 'tab-pane';
  archPane.id = 'pane-architecture';
  archPane.innerHTML = renderArchitecture();
  cont.appendChild(archPane);

  // Executive Summary is the default-active tab on load - scroll the sprint matrix to "current"
  // Two rAFs to ensure the table has been laid out before measuring offsets
  requestAnimationFrame(() => requestAnimationFrame(scrollSprintMatrixToCurrent));
}

init();

// Set --ring-circ on each ring arc so the animation knows where to start
document.querySelectorAll('.bv-ring-arc').forEach(el => {
  const circ = parseFloat(el.getAttribute('stroke-dasharray'));
  el.style.setProperty('--ring-circ', circ);
});
